services:
  okx-scanner:
    build: .
    image: okx-rtm-scanner:latest
    container_name: okx-rtm-scanner
    restart: unless-stopped
    # outbound uses the host's public IP — the IP your OKX key whitelists
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./state:/app/state          # persists daily-loss + open positions
      - ./logs:/app/logs            # rotating log history
    command: ["scan"]               # override with: docker compose run okx-scanner backtest
