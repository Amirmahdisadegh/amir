# =====================================================================
#  OKX RTM Scanner — configuration
#  Copy to `config.yaml` and edit. Secrets go in `.env`, NOT here.
# =====================================================================

# ---------------------------------------------------------------------
# mode:
#   scan  -> Mode 1: only scan + Telegram alerts (manual trading by you)
#   live  -> Mode 2: automatic order execution (ALL risk limits enforced)
#            Only enable after weeks of successful OKX Demo testing.
# ---------------------------------------------------------------------
mode: scan

exchange:
  id: okx
  # Data (OHLCV/tickers) needs no keys. Keys are ONLY read from .env
  # and ONLY used in `live` mode for order execution.
  sandbox: true            # true = OKX Demo Trading (paper). Keep true until proven.
  market_type: swap        # swap (USDT-margined perps) | spot
  quote: USDT              # only pairs quoted in this asset are scanned
  rate_limit_ms: 200       # min delay between REST calls (ccxt enforces too)
  max_concurrency: 8       # parallel OHLCV requests per batch

universe:
  # How to build the list of symbols to scan.
  top_by_volume: 80        # keep the N highest 24h-quote-volume pairs (0 = all)
  min_quote_volume: 5_000_000   # discard pairs below this 24h volume (in quote ccy)
  include: []              # force-include symbols, e.g. ["BTC/USDT:USDT"]
  exclude: []              # force-exclude symbols

scan:
  timeframes: ["15m", "1h", "4h"]
  ohlcv_limit: 300         # candles fetched per timeframe
  poll_interval_sec: 300   # seconds between full scan cycles
  # A signal must appear on at least this many of the timeframes above
  # to be alerted (1 = any TF, 2 = confluence of two, etc.)
  min_timeframe_confluence: 1
  # Only send alerts for signals scoring at least this (0-100). Raise to cut
  # noise; ~60 keeps only decent setups, ~70 only strong ones. 0 = send all.
  min_score: 60

rtm:
  # --- structure detection ---
  swing_lookback: 2            # bars each side to confirm a pivot high/low
  base_max_body_ratio: 0.45    # candle is a "base" if |body|/range <= this
  base_max_candles: 3          # max candles that form a single base zone
  leg_min_body_ratio: 0.55     # impulsive "leg" candle: |body|/range >= this
  # --- signal quality filters ---
  min_leg_atr_mult: 1.2        # BOS leg must travel >= this * ATR
  confirm_vol_mult: 1.3        # confirmation candle volume >= this * avg volume
  max_dist_to_zone_atr: 1.5    # price must be within this * ATR of the entry zone
  min_risk_reward: 1.8         # discard setups whose TP/SL RR is below this
  zone_freshness_bars: 60      # zone must have formed within this many bars

risk:
  # --- NON-NEGOTIABLE. These caps are always enforced in live mode. ---
  account_equity_usdt: 1000    # used for sizing when not reading live balance
  risk_per_trade_pct: 1.0      # % of equity risked per trade (1–2 recommended)
  atr_period: 14
  atr_sl_mult: 1.5             # stop distance = atr_sl_mult * ATR (floor)
  take_profit_rr: 2.0          # TP placed at this risk-reward multiple
  max_open_positions: 3        # total concurrent open positions (all symbols)
  max_positions_per_symbol: 1
  daily_loss_limit_pct: 3.0    # halt the bot for the day at this realized loss
  max_leverage: 3              # cap leverage in live mode

telegram:
  enabled: true
  # token & chat_id come from .env (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
  alert_cooldown_sec: 1800     # min seconds between identical alerts (symbol+tf+type)

backtest:
  symbols: ["BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT"]
  timeframe: "1h"
  since_days: 120              # how many days of history to test
  starting_equity: 1000
  fee_pct: 0.05                # taker fee charged per side (% of notional)
  slippage_pct: 0.02           # slippage applied to market/stop fills (% of price)
  max_open_positions: 3        # portfolio-wide concurrent position cap

security:
  # Reminder only — enforce IP allow-listing on the OKX API key itself.
  allowed_server_ip: "206.245.166.128"
