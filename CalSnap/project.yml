name: CalSnap
options:
  bundleIdPrefix: com.amirmahdisadegh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  CalSnap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CalSnap
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirmahdisadegh.calsnap
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # Set your team in Xcode (Signing & Capabilities) or put the ID here:
        # DEVELOPMENT_TEAM: ABCDE12345
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CalSnap/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: CalSnap/Info.plist
      properties:
        CFBundleDisplayName: CalSnap
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: CalSnap uses the camera to take photos and videos of your meals so AI can recognize the food and estimate calories.
        NSPhotoLibraryUsageDescription: CalSnap lets you pick photos or videos of your meals from your library for AI analysis.
        ITSAppUsesNonExemptEncryption: false
