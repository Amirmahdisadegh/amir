name: WhiteDNS
options:
  bundleIdPrefix: com.whitedns
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  WhiteDNS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhiteDNS
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitedns.app
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WhiteDNS/Resources/Info.plist
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "White DNS"
    entitlements:
      path: WhiteDNS/Resources/WhiteDNS.entitlements
    info:
      path: WhiteDNS/Resources/Info.plist
    dependencies:
      - sdk: NetworkExtension.framework
    attributes:
      SystemCapabilities:
        com.apple.NetworkExtension:
          enabled: 1
